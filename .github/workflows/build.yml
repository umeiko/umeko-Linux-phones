name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVICE_ENV: devices/wt88047.env
  # Combined extlinux package: one kernel/rootfs serving all listed devices
  # (fdtdir boot; lk2nd/lk1st picks the dtb per device).
  DEVICE_ENVS_EXTLINUX: devices/wt88047.env devices/vivo-y23l.env
  PACK_VERSION: ${{ github.ref_name }}
  # CI builds the base package only. buffyboard (on-screen keyboard) is slow
  # to compile under qemu; local builds can enable it via BUFFYBOARD=1
  # (payload is then cached in .cache/ for fast rebuilds). See docs/build.md.
  BUFFYBOARD: "0"

jobs:
  # 文档/杂项 push 不触发刷机包构建。不用 trigger 级 paths-ignore，因为
  # paths-ignore 对 tag push 同样生效，可能把 v* 发版构建一起跳过。
  # 这里用一个秒级 job 做门控：tag 发版和手动触发永远放行。
  changes:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref_type == 'branch'
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要 before 提交做 diff；仓库本身很小
      - id: check
        run: |
          CHANGED=$(git diff --name-only "${{ github.event.before }}" HEAD)
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(scripts|devices|config|kernels)/|^\.gitmodules$|^\.github/workflows/build\.yml$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: wt88047 (msm8916)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_type == 'tag' ||
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned kernel submodule (shallow)
        run: git submodule update --init --depth 1 kernels/msm8916

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu bc bison flex libssl-dev libncurses-dev kmod ccache dwarves \
            qemu-user-static mkbootimg android-sdk-libsparse-utils e2fsprogs zip curl ca-certificates

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-wt88047
          max-size: 500M

      - name: Cache ubuntu-base tarball
        uses: actions/cache@v4
        with:
          path: .cache
          key: ubuntu-base-24.04.3-arm64

      - name: Build kernel
        run: ./scripts/build_kernel.sh $DEVICE_ENVS_EXTLINUX

      - name: Build rootfs image
        run: ./scripts/build_rootfs.sh "$DEVICE_ENV"

      - name: Assemble rootfs (chroot)
        run: ./scripts/assemble.sh $DEVICE_ENVS_EXTLINUX

      - name: Pack extlinux bundle (multi-device)
        run: ./scripts/pack_extlinux.sh $DEVICE_ENVS_EXTLINUX

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wt88047-package
          path: out/*.zip
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          generate_release_notes: true

  # cancro (Xiaomi Mi 4, msm8974) is 32-bit armhf with its own kernel source —
  # a separate package, not part of the msm8916 combined extlinux bundle.
  build-cancro:
    name: cancro (msm8974, armhf)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_type == 'tag' ||
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned kernel submodule (shallow)
        run: git submodule update --init --depth 1 kernels/msm8974

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabi bc bison flex libssl-dev libncurses-dev kmod ccache dwarves \
            qemu-user-static mkbootimg android-sdk-libsparse-utils e2fsprogs zip curl ca-certificates

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-cancro
          max-size: 500M

      - name: Cache ubuntu-base tarball
        uses: actions/cache@v4
        with:
          path: .cache
          key: ubuntu-base-24.04.3-armhf

      - name: Build kernel
        run: ./scripts/build_kernel.sh devices/cancro.env

      - name: Build rootfs image
        run: ./scripts/build_rootfs.sh devices/cancro.env

      - name: Assemble rootfs (chroot)
        run: ./scripts/assemble.sh devices/cancro.env

      - name: Pack extlinux bundle
        run: ./scripts/pack_extlinux.sh devices/cancro.env

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cancro-package
          path: out/*.zip
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          generate_release_notes: false
