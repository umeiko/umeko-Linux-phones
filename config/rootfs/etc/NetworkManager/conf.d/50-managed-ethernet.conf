# Ubuntu's stock /usr/lib/NetworkManager/conf.d/10-globally-managed-devices.conf
# leaves plain ethernet unmanaged (Debian ifupdown heritage):
#   unmanaged-devices=*,except:type:wifi,except:type:gsm,except:type:cdma
# On this phone (Klipper host, OTG may carry a USB ethernet adapter) we want
# NM to manage ethernet — same net effect as appending except:type:ethernet
# to the stock file (verified on Redmi 2). unmanaged-devices lists from all
# conf.d files merge in lexical order, last match wins; usb0 stays unmanaged
# because 99-unmanaged-usb0.conf sorts after this file.
[keyfile]
unmanaged-devices=except:type:ethernet
