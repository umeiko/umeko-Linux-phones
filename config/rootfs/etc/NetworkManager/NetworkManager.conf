# Same as Ubuntu's stock NetworkManager.conf except [ifupdown] managed=true:
# the stock 'false' (plus a missing wpasupplicant in ubuntu-base) leaves NM
# refusing to manage interfaces — wlan0 shows 'unavailable' in nmcli.
[main]
plugins=ifupdown,keyfile

[ifupdown]
managed=true

[device]
wifi.scan-rand-mac-address=no
