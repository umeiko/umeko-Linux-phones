site_name: umeko-Linux-phones
site_description: 把旧手机变成 Linux 上位机 —— 全自动构建系统文档
repo_url: https://github.com/umeiko/umeko-Linux-phones
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - 首页（产物是什么、怎么用）: index.md
  - 原理：手机为什么能跑主线 Linux: principle.md
  - 构建系统详解: build.md
  - 本地 Docker 构建: docker.md
  - 刷机与日常使用: flashing.md
  - 机型列表:
    - devices/index.md
    - 红米 2（wt88047）: devices/wt88047.md
    - vivo Y23L（vivo-y23l）: devices/vivo-y23l.md
    - 小米 4（cancro）: devices/cancro.md
  - 可选路线：extlinux 启动（实验性）: extlinux.md
